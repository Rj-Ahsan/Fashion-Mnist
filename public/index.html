<h1>👕 Fashion-MNIST Classifier</h1>

<p class="subtitle">
    Upload an image and let the CNN predict the clothing category.
</p>

<div class="upload-box">

    <label for="imageInput">
        Select a Fashion-MNIST image
    </label>

    <br>

    <input
        type="file"
        id="imageInput"
        accept="image/*"
    >

    <img id="preview" alt="Image Preview">

</div>

<button id="predictButton" disabled>
    Predict
</button>

<div id="result">

    <div>Prediction</div>

    <div class="prediction" id="prediction">
        -
    </div>

    <div class="confidence" id="confidence">
        -
    </div>

```

</div>

<script>

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const predictButton = document.getElementById("predictButton");

    const result = document.getElementById("result");
    const prediction = document.getElementById("prediction");
    const confidence = document.getElementById("confidence");


    // Preview selected image
    imageInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {
            predictButton.disabled = true;
            preview.style.display = "none";
            return;
        }

        const reader = new FileReader();

        reader.onload = function (event) {

            preview.src = event.target.result;
            preview.style.display = "block";

        };

        reader.readAsDataURL(file);

        predictButton.disabled = false;

        result.style.display = "none";
    });


    // Send image to CNN API
    predictButton.addEventListener("click", async function () {

        const file = imageInput.files[0];

        if (!file) {
            return;
        }

        predictButton.disabled = true;
        predictButton.textContent = "Predicting...";

        result.style.display = "block";

        prediction.textContent = "Processing...";
        confidence.textContent = "";


        const formData = new FormData();

        formData.append("file", file);


        try {

            const response = await fetch("/api/predict", {
                method: "POST",
                body: formData
            });


            const data = await response.json();


            if (!response.ok) {
                throw new Error(data.error || "Prediction failed");
            }


            prediction.textContent =
                data.prediction || "Unknown";


            if (data.confidence !== undefined) {

                confidence.textContent =
                    "Confidence: " +
                    (Number(data.confidence) * 100).toFixed(2) +
                    "%";

            } else {

                confidence.textContent = "";

            }


        } catch (error) {

            prediction.innerHTML =
                `<span class="error">${error.message}</span>`;

            confidence.textContent = "";

        }


        predictButton.disabled = false;
        predictButton.textContent = "Predict";

    });

</script>

</body>
